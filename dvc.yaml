stages:
  extract_corpus:
    cmd: python scripts/extract_corpus.py --pdf data/raw/civil_code.pdf --out data/interim/civil_code.json --topic-overrides scripts/topic_overrides.json --manual-patches scripts/manual_patches.json
    deps:
      - scripts/extract_corpus.py
      - data/raw/civil_code.pdf
      - scripts/topic_overrides.json
      - scripts/manual_patches.json
    outs:
      - data/interim/civil_code.json

  validate_corpus:
    cmd: pytest tests/test_corpus_validation.py -v && touch data/interim/.validated
    deps:
      - data/interim/civil_code.json
      - tests/test_corpus_validation.py
    outs:
      - data/interim/.validated

  chunk_corpus:
    cmd: python scripts/chunk_corpus.py --corpus data/interim/civil_code.json --out data/interim/chunks.json --params params.yaml
    deps:
      - scripts/chunk_corpus.py
      - data/interim/civil_code.json
      - data/interim/.validated
    params:
      - chunking.paragraph_split_threshold_chars
      - chunking.dedupe_repealed_ranges
    outs:
      - data/interim/chunks.json

  embed_index:
    cmd: python scripts/embed_and_index.py --chunks data/interim/chunks.json --params params.yaml
    deps:
      - scripts/embed_and_index.py
      - data/interim/chunks.json
    params:
      - embedding.model_name
      - embedding.batch_size
      - qdrant.collection_name
      - qdrant.storage_path
    outs:
      - data/processed/qdrant_storage
