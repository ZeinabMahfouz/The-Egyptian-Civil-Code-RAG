# Optional: serve retrieval from a Qdrant server instead of the local store
# baked into the image. Faster under concurrent load (docs/decisions.md,
# "Retrieval under load"); for one user the default setup is enough.
#
#   docker compose -f docker-compose.yml -f docker-compose.qdrant.yml up -d
#
# On start the API copies its baked-in index into the server (skipped when
# the server already holds the same number of points), then serves from it.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333" # dashboard at http://localhost:6333/dashboard

  api:
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    command:
      - sh
      - -c
      - >-
        python -m egyptian_civil_code_rag.qdrant_seed --url http://qdrant:6333
        && exec uvicorn egyptian_civil_code_rag.api:app --host 0.0.0.0 --port 8000

volumes:
  qdrant_data:
