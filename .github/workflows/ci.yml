name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      # This project's DVC remote is Google Drive, authenticated via a
      # personal OAuth client (see docs/decisions.md -- a service
      # account was tried first and confirmed broken: "Service Accounts
      # do not have storage quota" on a personal, non-Workspace Drive
      # account). CI reconstructs the same cached-credential setup used
      # locally: client_id/secret go into .dvc/config.local equivalent
      # (via --local, not committed), and the pre-authorized token goes
      # to the exact path dvc-gdrive expects, confirmed empirically on
      # the developer's own machine: ~/.cache/pydrive2fs/<client_id>/default.json
      - name: Configure DVC Google Drive credentials
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_USER_CREDENTIALS: ${{ secrets.GDRIVE_USER_CREDENTIALS }}
        run: |
          dvc remote modify --local gdrive-storage gdrive_client_id "$GDRIVE_CLIENT_ID"
          dvc remote modify --local gdrive-storage gdrive_client_secret "$GDRIVE_CLIENT_SECRET"
          mkdir -p ~/.cache/pydrive2fs/"$GDRIVE_CLIENT_ID"
          echo "$GDRIVE_USER_CREDENTIALS" > ~/.cache/pydrive2fs/"$GDRIVE_CLIENT_ID"/default.json

      - name: DVC pull
        run: dvc pull

      - name: Run tests
        run: pytest tests/test_corpus_validation.py tests/test_api.py tests/test_reindex_batch.py tests/test_pii.py tests/test_canary_report.py tests/test_tracing.py tests/test_metrics.py tests/test_streaming.py tests/test_extract_arabic.py tests/test_gpu_eval.py tests/test_ragas_gate.py tests/test_vllm_backend.py tests/test_quant_compare.py tests/test_locust_summary.py tests/test_embedding_drift.py tests/test_packaging.py tests/test_alert_receiver.py tests/test_qdrant_seed.py -v

  rebuild_index:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Configure DVC Google Drive credentials
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_USER_CREDENTIALS: ${{ secrets.GDRIVE_USER_CREDENTIALS }}
        run: |
          dvc remote modify --local gdrive-storage gdrive_client_id "$GDRIVE_CLIENT_ID"
          dvc remote modify --local gdrive-storage gdrive_client_secret "$GDRIVE_CLIENT_SECRET"
          mkdir -p ~/.cache/pydrive2fs/"$GDRIVE_CLIENT_ID"
          echo "$GDRIVE_USER_CREDENTIALS" > ~/.cache/pydrive2fs/"$GDRIVE_CLIENT_ID"/default.json

      - name: DVC pull
        run: dvc pull

      - name: Reproduce pipeline from source (rebuilds + re-indexes)
        run: dvc repro

      - name: Check reproducibility (no unexpected drift from tracked outputs)
        run: dvc status

  build_and_push_image:
    runs-on: ubuntu-latest
    needs: rebuild_index
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies (DVC only, for pulling the vector store)
        run: pip install -r requirements.txt

      - name: Configure DVC Google Drive credentials
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_USER_CREDENTIALS: ${{ secrets.GDRIVE_USER_CREDENTIALS }}
        run: |
          dvc remote modify --local gdrive-storage gdrive_client_id "$GDRIVE_CLIENT_ID"
          dvc remote modify --local gdrive-storage gdrive_client_secret "$GDRIVE_CLIENT_SECRET"
          mkdir -p ~/.cache/pydrive2fs/"$GDRIVE_CLIENT_ID"
          echo "$GDRIVE_USER_CREDENTIALS" > ~/.cache/pydrive2fs/"$GDRIVE_CLIENT_ID"/default.json

      - name: DVC pull (fetch vector store for Docker COPY)
        run: dvc pull

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase; GitHub usernames/repo names
      # may not be (this repo's owner isn't), so this can't be used
      # directly in the tag without conversion.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest only from main, so reviewers get the merged version, never a PR build.
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}:latest', env.IMAGE_NAME) || '' }}

  # RAGAS quality gate. CI has no GPU, so it can't regenerate and judge
  # answers; it checks the committed GPU evaluation instead
  # (reports/ragas_results.json, produced by scripts/gpu_eval.py full on
  # Kaggle): faithfulness >= 0.75 on the CI subset, out-of-corpus
  # questions declined, and -- the part that makes it a gate -- the
  # evaluation must match the corpus (dvc.lock md5) and the
  # chunking/embedding params the repo builds today.
  ragas_gate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install gate dependencies
        run: pip install pyyaml
      - name: RAGAS gate
        run: python scripts/ragas_gate.py
