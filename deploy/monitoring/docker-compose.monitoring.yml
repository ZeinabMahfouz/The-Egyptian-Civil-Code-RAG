# Prometheus + Grafana for the RAG API.
#
#   docker compose -f deploy/monitoring/docker-compose.monitoring.yml up -d
#
#   Prometheus  http://localhost:19090   (targets: /targets, alerts: /alerts)
#   Grafana     http://localhost:3001    (admin / admin, dashboard "Egyptian Civil Code RAG")
#
# Host ports are 19090 / 3001, not the defaults 9090 / 3000: on the dev
# machine those are taken by Langfuse (3000) and its MinIO (9090).
# The API itself runs on the host: uvicorn ... --port 8000.

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
