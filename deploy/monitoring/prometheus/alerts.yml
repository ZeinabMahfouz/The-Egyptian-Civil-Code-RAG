# Alert rules for the RAG API. Visible (and firing) at http://localhost:19090/alerts.
# Firing alerts go to Alertmanager, which delivers them (alertmanager/alertmanager.yml).
groups:
  - name: rag-quality
    rules:
      # The course checklist's quality alert. rag_ragas_faithfulness is only
      # exported once a RAGAS run has produced real scores, so this stays
      # silent (no data) until then -- it never fires on "no evaluation yet".
      - alert: RagFaithfulnessLow
        expr: rag_ragas_faithfulness < 0.80
        labels:
          severity: critical
        annotations:
          summary: "RAGAS faithfulness {{ $value | printf \"%.2f\" }} is below 0.80"
          description: >-
            Answers are drifting from the retrieved articles. For a legal
            assistant this means unsupported claims -- check the latest
            RAGAS run in MLflow before promoting any release.

      # Batch drift check (scripts/embedding_drift.py). Fires per query
      # window with too many questions that have no close match among the
      # indexed articles: users are asking about something the Civil Code
      # doesn't cover. (Centroid drift is on the dashboard but doesn't alert:
      # it flagged ordinary Civil Code questions -- docs/decisions.md.)
      - alert: RagQueryDrift
        expr: rag_query_off_corpus_share >= on(window) rag_query_off_corpus_limit
        labels:
          severity: warning
        annotations:
          summary: "Query window {{ $labels.window }}: {{ $value | humanizePercentage }} of questions have no close match in the Civil Code"
          description: >-
            More questions than chance allows (binomial test, 1% false-alarm
            rate) fall below the corpus similarity cut-off. Users are asking
            about something the indexed articles don't cover; RAGAS scores
            don't describe this traffic. Check the questions, extend the
            corpus or the eval set.

  - name: rag-serving
    rules:
      - alert: RagApiDown
        expr: up{job="rag-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RAG API is not answering /metrics"

      - alert: RagHighErrorRate
        expr: |
          sum(rate(rag_requests_total{status="error"}[5m]))
            / clamp_min(sum(rate(rag_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of /ask requests are failing"

      # 120s fits the CPU dev backend (~30s-2min per answer). Tighten this
      # when vLLM on GPU is serving -- the threshold should follow the SLO,
      # not the hardware we happen to be on.
      - alert: RagSlowP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(rag_request_latency_seconds_bucket{stage="total"}[5m]))) > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "/ask p95 latency {{ $value | printf \"%.0f\" }}s is above 120s"
