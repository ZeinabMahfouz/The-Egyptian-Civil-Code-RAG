# Prometheus scrape config for the RAG API.
#
# The API runs on the host (uvicorn on port 8000), Prometheus in Docker.
# host.docker.internal is how a container reaches the host -- built into
# Docker Desktop, and mapped via extra_hosts in the compose file for plain
# Linux Docker.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Firing alerts are sent to Alertmanager, which groups and delivers them.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          app: egyptian-civil-code-rag
