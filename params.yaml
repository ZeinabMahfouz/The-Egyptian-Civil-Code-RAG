chunking:
  paragraph_split_threshold_chars: 700
  dedupe_repealed_ranges: true

embedding:
  model_name: "BAAI/bge-m3"
  batch_size: 32

qdrant:
  collection_name: "egyptian_civil_code"
  storage_path: "data/processed/qdrant_storage"

# Refusal gate (RAGQueryEngine.should_refuse): decline before generation when
# the best match among the indexed articles is below min_score. null = off.
# Calibrated with scripts/refusal_calibration.py (reports/refusal_calibration.md).
refusal:
  min_score: 0.47
